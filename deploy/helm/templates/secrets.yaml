{{- $objAccess := include "opensynapse.credential" (dict "root" . "key" "s3-access-key" "value" (ternary .Values.objectStorage.accessKey .Values.externalObjectStorage.accessKey .Values.objectStorage.enabled)) -}}
{{- $objSecret := include "opensynapse.credential" (dict "root" . "key" "s3-secret-key" "value" (ternary .Values.objectStorage.secretKey .Values.externalObjectStorage.secretKey .Values.objectStorage.enabled)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "opensynapse.labels" . | nindent 4 }}
type: Opaque
data:
  # Encrypts stored secrets; must stay the same across upgrades.
  secret-key: {{ include "opensynapse.credential" (dict "root" . "key" "secret-key" "value" .Values.controlPlane.secretKey) | b64enc | quote }}
  {{- if not .Values.postgres.enabled }}
  db-dsn: {{ required "externalDatabase.dsn is required when postgres.enabled=false" .Values.externalDatabase.dsn | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ include "opensynapse.credential" (dict "root" . "key" "postgres-password" "value" .Values.postgres.password) | b64enc | quote }}
  {{- end }}
  s3-access-key: {{ $objAccess | b64enc | quote }}
  s3-secret-key: {{ $objSecret | b64enc | quote }}
  {{- if .Values.controlPlane.adminPassword }}
  admin-password: {{ .Values.controlPlane.adminPassword | b64enc | quote }}
  {{- end }}
