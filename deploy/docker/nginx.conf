# Keep the scheme a TLS-terminating proxy in front of this one reports.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to control plane. $http_host keeps the port the
    # browser used, which the control plane's Origin check compares against.
    location /api/ {
        proxy_pass http://control-plane:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Micro-tests and report exports can take a while.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://control-plane:8090;
    }

    location /ready {
        proxy_pass http://control-plane:8090;
    }

    location /version {
        proxy_pass http://control-plane:8090;
    }

    # WebSocket upgrade
    location /api/v1/ws {
        proxy_pass http://control-plane:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
