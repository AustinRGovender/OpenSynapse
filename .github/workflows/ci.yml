name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go:
    name: Go (control plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/control-plane/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-postgres:
    name: Go tests on Postgres (cluster-mode database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      # Every test database becomes a fresh schema in this Postgres.
      OPENSYNAPSE_TEST_POSTGRES_DSN: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/control-plane/go.mod

      - name: Test
        run: go test ./... -count=1

  web:
    name: Web (React SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm --filter web build

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      # Every component has a story; building them all catches broken ones.
      - name: Build Storybook
        run: pnpm --filter web build-storybook

  api-client:
    name: API client (generated from the OpenAPI document)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/control-plane/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Regenerates openapi.json and schema.d.ts and fails if they differ from
      # what is committed: run `pnpm --filter @opensynapse/api-client generate`.
      - name: Check for drift
        run: pnpm --filter @opensynapse/api-client check

      - name: Type-check
        run: pnpm --filter @opensynapse/api-client typecheck

  helm:
    name: Helm (chart validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Fetch chart dependencies (k6-operator)
        run: helm dependency update deploy/helm/

      - name: Lint chart
        run: helm lint deploy/helm/

      - name: Template chart
        run: helm template test-release deploy/helm/

  docker:
    name: Docker (image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.control-plane
          push: false
          load: true
          tags: opensynapse/control-plane:ci

      # Guard against ADR-0007 regressions: the control-plane image MUST ship
      # a k6 binary on PATH with the xk6-kv extension baked in, otherwise
      # /runs returns ENGINE_NOT_AVAILABLE and live control cannot work.
      - name: Verify bundled k6 and xk6-kv
        run: |
          set -euo pipefail
          docker run --rm --entrypoint k6 opensynapse/control-plane:ci version > k6-version.txt
          cat k6-version.txt
          grep -q "xk6-kv" k6-version.txt || {
            echo "::error::k6 binary in control-plane image is missing the xk6-kv extension (see docs/decisions/0007-k6-xk6-kv-bundled-in-control-plane-image.md)"
            exit 1
          }

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
          tags: opensynapse/web:ci
